[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "smartisp"
version = "0.1.0"
description = "Intelligent hybrid smartphone image signal processing"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "SmartISP contributors" }]
keywords = ["isp", "computational-photography", "pytorch", "image-restoration"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy==2.5.4",
    "opencv-python-headless==4.14.0.94",
    "Pillow==13.0.0",
    "PyYAML==6.0.3",
    "scikit-image==0.26.0",
    "psutil==7.2.2",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
torch = [
    "torch==2.14.1",
    "torchvision==0.29.2",
    "lpips==0.1.4",
]
app = [
    "streamlit==1.67.0",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
]

[project.scripts]
smartisp-train = "smartisp.training.train:main"
smartisp-validate = "smartisp.training.validate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smartisp"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "apps", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["smartisp"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = ["build", "dist"]
