project:
  name: SmartISP
  seed: 0

paths:
  data_root: ${SMARTISP_DATA_ROOT:-data}
  checkpoint_dir: ${SMARTISP_CHECKPOINT_DIR:-checkpoints}
  output_dir: outputs

training:
  experiment: smartisp-post-isp
  seed: 0
  device: auto
  epochs: 100
  batch_size: 8
  num_workers: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  amp: true
  grad_clip: 1.0
  patch_size: 256
  val_interval: 1
  train_split: train
  val_split: val
  input_domain: srgb
  target_domain: srgb

model:
  in_channels: 3
  out_channels: 3
  base_channels: 32
  max_channels: 512
  depth: 4
  groups: 8
  norm: group
  activation: silu
  dropout: 0.0
  residual: true
  attention: false
  upsample: bilinear

data:
  input_dir: input
  target_dir: target
  input_extensions:
    - .png
  target_extensions:
    - .png
  crop_size: 256
  scale: 1
  recursive: true

loss:
  kind: composite
  weight: 1.0
  charbonnier_weight: 1.0
  ssim_weight: 0.1
  perceptual_weight: 0.0
  epsilon: 0.001

evaluation:
  metrics:
    - psnr
    - ssim
    - lpips
    - delta_e_2000
  data_range: 1.0
  lpips_net: alex

pipeline:
  mode: post_isp
